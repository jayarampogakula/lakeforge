name: LakeForge Automated PR Review & Duplicate Function Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, dev ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  automated-pr-review:
    name: Automated PR Review & Duplicate Function Detection
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with Full History
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Package & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run LakeForge PR Reviewer & Duplicate Function Check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        echo "Analyzing Pull Request #${PR_NUMBER} against base branch 'origin/${{ github.base_ref }}'..."
        python lakeforge/cli/pr_reviewer.py \
          --base-ref "origin/${{ github.base_ref }}" \
          --post-comment

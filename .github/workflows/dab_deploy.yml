# Manual DAB deploy: deploy deployments/<client_id> to a chosen stage.
# Branch policy: non-dev stages may ONLY be deployed from 'main';
# 'dev' may be deployed from any branch (including feature branches).
# Stages are defined centrally in configs/environments/env_settings.json.
name: DAB Deploy

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client ID (bundle located at deployments/<client_id>)'
        required: true
        type: string
      stage:
        description: 'Target stage (any stage defined in configs/environments/env_settings.json)'
        required: true
        default: 'dev'
        type: string
      run_setup:
        description: 'Run the environment_setup job after deploy (tick on the FIRST deployment of this bundle to a stage - provisions catalogs/schemas/volumes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  deploy:
    name: Deploy ${{ inputs.client_id }} to ${{ inputs.stage }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce branch policy (non-dev stages deploy from main only)
        if: inputs.stage != 'dev' && github.ref_name != 'main'
        run: |
          echo "::error::Stage '${{ inputs.stage }}' may only be deployed from branch 'main' (current: '${{ github.ref_name }}'). Feature branches can deploy to dev only."
          exit 1

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate stage against registry
        run: |
          if ! jq -e --arg s "${{ inputs.stage }}" 'has($s)' configs/environments/env_settings.json > /dev/null; then
            echo "::error::Stage '${{ inputs.stage }}' is not defined in the stage registry (configs/environments/env_settings.json). Available stages: $(jq -r 'keys | join(", ")' configs/environments/env_settings.json)"
            exit 1
          fi

      # Multi-account support: host comes from the registry (workspace_host),
      # fallback to a per-stage secret, else the global secret. Credentials: a
      # per-stage service principal via OAuth client ID + secret (M2M - takes
      # precedence), or a per-stage PAT via DATABRICKS_<STAGE>_TOKEN, else global.
      - name: Select stage credentials
        run: |
          set -euo pipefail
          STAGE_HOST=$(jq -r --arg s "${{ inputs.stage }}" '.[$s].workspace_host // empty' configs/environments/env_settings.json)
          if [ -z "$STAGE_HOST" ]; then
            STAGE_HOST='${{ secrets[format('DATABRICKS_%s_HOST', inputs.stage)] }}'
          fi
          if [ -n "$STAGE_HOST" ]; then
            echo "DATABRICKS_HOST=$STAGE_HOST" >> "$GITHUB_ENV"
            echo "Using stage-specific host: $STAGE_HOST"
          else
            echo "Using global DATABRICKS_HOST secret (stage in this workspace/account)."
          fi
          STAGE_TOKEN='${{ secrets[format('DATABRICKS_%s_TOKEN', inputs.stage)] }}'
          STAGE_CLIENT_ID='${{ secrets[format('DATABRICKS_%s_CLIENT_ID', inputs.stage)] }}'
          STAGE_CLIENT_SECRET='${{ secrets[format('DATABRICKS_%s_CLIENT_SECRET', inputs.stage)] }}'
          if [ -n "$STAGE_CLIENT_ID" ] && [ -n "$STAGE_CLIENT_SECRET" ]; then
            # Service principal OAuth (M2M): client ID + secret win over any token.
            echo "DATABRICKS_CLIENT_ID=$STAGE_CLIENT_ID" >> "$GITHUB_ENV"
            echo "DATABRICKS_CLIENT_SECRET=$STAGE_CLIENT_SECRET" >> "$GITHUB_ENV"
            echo "DATABRICKS_TOKEN=" >> "$GITHUB_ENV"
            echo "Using service-principal OAuth client credentials (M2M) for stage '${{ inputs.stage }}'."
          elif [ -n "$STAGE_TOKEN" ]; then
            echo "DATABRICKS_TOKEN=$STAGE_TOKEN" >> "$GITHUB_ENV"
            echo "Using stage-specific token for stage '${{ inputs.stage }}'."
          else
            echo "Using global DATABRICKS_TOKEN secret for stage '${{ inputs.stage }}'."
          fi

      - name: Validate bundle
        working-directory: deployments/${{ inputs.client_id }}
        run: |
          if [ ! -f databricks.yml ]; then
            echo "::error::No bundle found at deployments/${{ inputs.client_id }} - run the 'DAB Export (Job to Bundle)' workflow first."
            exit 1
          fi
          databricks bundle validate --target "${{ inputs.stage }}"

      - name: Deploy bundle
        working-directory: deployments/${{ inputs.client_id }}
        run: |
          databricks bundle deploy --target "${{ inputs.stage }}"

      # First-deployment step: provisions the stage's catalogs/schemas/volumes
      # (idempotent). Requires the environment_setup job resource in the bundle.
      - name: Run environment setup job (first deployment to this stage)
        if: inputs.run_setup
        working-directory: deployments/${{ inputs.client_id }}
        run: |
          databricks bundle run environment_setup --target "${{ inputs.stage }}"

name: LakeForge CI/CD Multi-Stage Pipeline

on:
  push:
    # Branch policy: dev/feature/bugfix branches deploy to DEV only (guarded below);
    # test/staging/prod deployments are only ever built from main.
    branches: [ main, dev, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Target Deployment Stage (any stage in configs/environments/env_settings.json)'
        required: true
        default: 'dev'
        type: string
      client_id:
        description: 'Client / Tenant Scope (leave blank for Global)'
        required: false
        default: ''
        type: string
      component:
        description: 'Components to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pipelines
          - views
          - governance
          - package
      dry_run:
        description: 'Perform Dry Run (audit preview only, no live modifications)'
        required: false
        default: false
        type: boolean

# Global default credentials (same-account stages). The Select Stage Credentials
# step overrides these per stage when the stage lives in another account.
env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  unit-tests:
    name: 1. Unit Tests & Configuration Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Verify Code Compilation
      run: |
        python -m compileall lakeforge/ tests/

    - name: Validate All Stage Configurations
      run: |
        for STAGE in $(jq -r 'keys[]' configs/environments/env_settings.json); do
          echo "Validating $STAGE stage configs..."
          lakeforge validate configs/ --env "$STAGE"
        done

    - name: Run Unit Tests
      run: |
        python -m pytest tests/unit_tests/ -v

  integration-tests:
    name: 2. End-to-End Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Integration Tests
      run: |
        python -m pytest tests/integration_tests/ -v

  deploy:
    name: 3. Deploy to Stage
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & CLI
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Determine Deployment Stage
      id: set-stage
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TARGET_STAGE="${{ github.event.inputs.stage }}"
          CLIENT_ARG="${{ github.event.inputs.client_id }}"
          COMP_ARG="${{ github.event.inputs.component }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
        else
          # Push builds: main promotes to the FIRST non-dev stage in the stage registry
          # (configs/environments/env_settings.json); dev/feature/bugfix branches deploy to dev ONLY
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET_STAGE=$(jq -r 'keys[] | select(. != "dev")' configs/environments/env_settings.json | head -1)
          else
            TARGET_STAGE="dev"
          fi
          CLIENT_ARG=""
          COMP_ARG="all"
          DRY_RUN="false"
        fi
        echo "STAGE=$TARGET_STAGE" >> $GITHUB_ENV
        echo "CLIENT=$CLIENT_ARG" >> $GITHUB_ENV
        echo "COMPONENT=$COMP_ARG" >> $GITHUB_ENV
        echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV
        echo "Deploying to target stage: $TARGET_STAGE (client: $CLIENT_ARG, component: $COMP_ARG, dry_run: $DRY_RUN)"

    - name: Validate Stage Against Registry
      run: |
        if ! jq -e --arg s "$STAGE" 'has($s)' configs/environments/env_settings.json > /dev/null; then
          echo "::error::Stage '$STAGE' is not defined in the stage registry (configs/environments/env_settings.json). Available stages: $(jq -r 'keys | join(", ")' configs/environments/env_settings.json)"
          exit 1
        fi

    # Multi-account support: host comes from the registry (workspace_host),
    # fallback to a per-stage secret, else the global secret. Credentials: a
    # per-stage service principal via OAuth client ID + secret (M2M - takes
    # precedence), or a per-stage PAT via DATABRICKS_<STAGE>_TOKEN, else global.
    - name: Select Stage Credentials
      run: |
        set -euo pipefail
        STAGE_HOST=$(jq -r --arg s "$STAGE" '.[$s].workspace_host // empty' configs/environments/env_settings.json)
        if [ -z "$STAGE_HOST" ]; then
          STAGE_HOST='${{ secrets[format('DATABRICKS_%s_HOST', env.STAGE)] }}'
        fi
        if [ -n "$STAGE_HOST" ]; then
          echo "DATABRICKS_HOST=$STAGE_HOST" >> "$GITHUB_ENV"
          echo "Using stage-specific host: $STAGE_HOST"
        else
          echo "Using global DATABRICKS_HOST secret (stage in this workspace/account)."
        fi
        STAGE_TOKEN='${{ secrets[format('DATABRICKS_%s_TOKEN', env.STAGE)] }}'
        STAGE_CLIENT_ID='${{ secrets[format('DATABRICKS_%s_CLIENT_ID', env.STAGE)] }}'
        STAGE_CLIENT_SECRET='${{ secrets[format('DATABRICKS_%s_CLIENT_SECRET', env.STAGE)] }}'
        if [ -n "$STAGE_CLIENT_ID" ] && [ -n "$STAGE_CLIENT_SECRET" ]; then
          # Service principal OAuth (M2M): client ID + secret win over any token.
          echo "DATABRICKS_CLIENT_ID=$STAGE_CLIENT_ID" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_SECRET=$STAGE_CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "DATABRICKS_TOKEN=" >> "$GITHUB_ENV"
          echo "Using service-principal OAuth client credentials (M2M) for stage '$STAGE'."
        elif [ -n "$STAGE_TOKEN" ]; then
          echo "DATABRICKS_TOKEN=$STAGE_TOKEN" >> "$GITHUB_ENV"
          echo "Using stage-specific token for stage '$STAGE'."
        else
          echo "Using global DATABRICKS_TOKEN secret for stage '$STAGE'."
        fi

    - name: Enforce Branch Policy (non-dev stages deploy from main only)
      if: env.STAGE != 'dev' && github.ref != 'refs/heads/main'
      run: |
        echo "::error::Stage '${{ env.STAGE }}' may only be deployed from branch 'main' (current branch: '${{ github.ref_name }}'). Feature/dev-branch runs deploy to dev only."
        exit 1

    - name: Execute Stage Deployment
      run: |
        CMD="lakeforge deploy --stage ${{ env.STAGE }} --component ${{ env.COMPONENT }}"
        if [ -n "${{ env.CLIENT }}" ]; then
          CMD="$CMD --client ${{ env.CLIENT }}"
        fi
        if [ "${{ env.DRY_RUN }}" = "true" ]; then
          CMD="$CMD --dry-run"
        fi
        echo "Executing: $CMD"
        $CMD

    - name: Upload Deployment Ledger Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deployment-ledger-${{ env.STAGE }}
        path: target/deploy_ledger_*.jsonl
        if-no-files-found: ignore

name: LakeForge CI/CD Multi-Stage Pipeline

on:
  push:
    # Branch policy: dev/feature/bugfix branches deploy to DEV only (guarded below);
    # test/staging/prod deployments are only ever built from main.
    branches: [ main, dev, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Target Deployment Stage'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - staging
          - prod
      client_id:
        description: 'Client / Tenant Scope (leave blank for Global)'
        required: false
        default: ''
        type: string
      component:
        description: 'Components to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pipelines
          - views
          - governance
          - package
      dry_run:
        description: 'Perform Dry Run (audit preview only, no live modifications)'
        required: false
        default: false
        type: boolean

jobs:
  unit-tests:
    name: 1. Unit Tests & Configuration Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Verify Code Compilation
      run: |
        python -m compileall lakeforge/ tests/

    - name: Validate All Stage Configurations
      run: |
        echo "Validating dev stage configs..."
        lakeforge validate configs/ --env dev
        echo "Validating test stage configs..."
        lakeforge validate configs/ --env test
        echo "Validating staging stage configs..."
        lakeforge validate configs/ --env staging
        echo "Validating prod stage configs..."
        lakeforge validate configs/ --env prod

    - name: Run Unit Tests
      run: |
        python -m pytest tests/unit_tests/ -v

  integration-tests:
    name: 2. End-to-End Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Integration Tests
      run: |
        python -m pytest tests/integration_tests/ -v

  deploy:
    name: 3. Deploy to Stage
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & CLI
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Determine Deployment Stage
      id: set-stage
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TARGET_STAGE="${{ github.event.inputs.stage }}"
          CLIENT_ARG="${{ github.event.inputs.client_id }}"
          COMP_ARG="${{ github.event.inputs.component }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
        else
          # Push builds: main promotes to test; dev/feature/bugfix branches deploy to dev ONLY
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET_STAGE="test"
          else
            TARGET_STAGE="dev"
          fi
          CLIENT_ARG=""
          COMP_ARG="all"
          DRY_RUN="false"
        fi
        echo "STAGE=$TARGET_STAGE" >> $GITHUB_ENV
        echo "CLIENT=$CLIENT_ARG" >> $GITHUB_ENV
        echo "COMPONENT=$COMP_ARG" >> $GITHUB_ENV
        echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV
        echo "Deploying to target stage: $TARGET_STAGE (client: $CLIENT_ARG, component: $COMP_ARG, dry_run: $DRY_RUN)"

    - name: Enforce Branch Policy (test/staging/prod deploy from main only)
      if: env.STAGE != 'dev' && github.ref != 'refs/heads/main'
      run: |
        echo "::error::Stage '${{ env.STAGE }}' may only be deployed from branch 'main' (current branch: '${{ github.ref_name }}'). Feature/dev-branch runs deploy to dev only."
        exit 1

    - name: Execute Stage Deployment
      run: |
        CMD="lakeforge deploy --stage ${{ env.STAGE }} --component ${{ env.COMPONENT }}"
        if [ -n "${{ env.CLIENT }}" ]; then
          CMD="$CMD --client ${{ env.CLIENT }}"
        fi
        if [ "${{ env.DRY_RUN }}" = "true" ]; then
          CMD="$CMD --dry-run"
        fi
        echo "Executing: $CMD"
        $CMD

    - name: Upload Deployment Ledger Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deployment-ledger-${{ env.STAGE }}
        path: target/deploy_ledger_*.jsonl
        if-no-files-found: ignore

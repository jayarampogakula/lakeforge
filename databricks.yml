# Databricks Asset Bundle (DAB) Configuration for LakeForge
# Supports stage-driven multi-target deployment (dev, test, staging, prod)
bundle:
  name: lakeforge

include:
  # GLOBAL resources only - per-resource files under infrastructure/databricks/resources/.
  # Each CLIENT has its own independent bundle: deployments/<client_id>/databricks.yml
  - infrastructure/databricks/resources/*.yml

variables:
  stage:
    description: "Deployment stage (dev, test, staging, prod)"
    default: "dev"
  client_id:
    description: "Client or tenant scope (optional)"
    default: ""

targets:
  dev:
    # No 'mode: development' on purpose: it would prefix all job names with
    # "[dev <username>]". Plain target keeps clean names; root_path stays
    # user-scoped below to keep personal deployments isolated.
    default: true
    workspace:
      root_path: ~/.lakeforge/dev
    variables:
      stage: "dev"

  test:
    # Production mode: locked bundle state, no uncommitted changes permitted
    mode: production
    workspace:
      root_path: /Workspace/Shared/lakeforge/test
    variables:
      stage: "test"

  staging:
    # Production mode: locked bundle state, no uncommitted changes permitted
    mode: production
    workspace:
      root_path: /Workspace/Shared/lakeforge/staging
    variables:
      stage: "staging"

  prod:
    # Production mode: locked bundle state, no uncommitted changes permitted
    mode: production
    workspace:
      root_path: /Workspace/Shared/lakeforge/prod
    variables:
      stage: "prod"

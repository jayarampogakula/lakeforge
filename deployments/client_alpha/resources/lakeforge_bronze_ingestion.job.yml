resources:
  jobs:
    lakeforge_bronze_ingestion:
      # Exported from UI job 456514839081144; params aligned with the current
      # Bronze_Generic_Pipeline widget set (source_config_file; pipeline_name/
      # source_system/load_type were removed in the widget refactor).
      name: lakeforge-bronze-ingestion-${bundle.target}
      tasks:
        - task_key: bronze_ingestion
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              client_id: client_alpha
              config_dir: ""
              create_views: "false"
              environment: ${bundle.target}
              stage: ${bundle.target}
              source_config_file: sales
            notebook_path: ../src/Bronze_Generic_Pipeline.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      tags:
        "client_id": "client_alpha"
        "release": "release"
      timeout_seconds: 0
      webhook_notifications: {}

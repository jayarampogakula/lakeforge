# LakeForge GLOBAL resources - the main cross-client medallion job.
# Client-specific jobs live in their own bundles: deployments/<client_id>/
resources:
  jobs:
    lakeforge_etl_pipeline:
      name: "lakeforge-medallion-pipeline-${bundle.target}"

      # Serverless-only workspace: no job_clusters block - notebook tasks run
      # on serverless compute for Jobs automatically.
      tasks:
        # Task 0: Environment Provisioning (env catalog + default schemas ONLY -
        # each client bundle provisions its own client catalog via its own job)
        - task_key: "setup_environment_provisioning"
          notebook_task:
            notebook_path: "../../../pipelines/SETUP_Environment_Provisioning.ipynb"
            base_parameters:
              config_dir: ""
              environment: "${bundle.target}"
              stage: "${bundle.target}"
              client_id: ""
              dry_run: "false"

        # Task 1: Bronze Ingestion
        - task_key: "bronze_customers_ingestion"
          depends_on:
            - task_key: "setup_environment_provisioning"
          notebook_task:
            notebook_path: "../../../pipelines/Bronze_Generic_Pipeline.ipynb"
            base_parameters:
              config_dir: ""
              source_config_file: "customers"
              environment: "${bundle.target}"
              stage: "${bundle.target}"
              client_id: "${var.client_id}"
              create_views: "false"

        # Task 2: Silver Cleansing & SCD2
        - task_key: "silver_customers_transformation"
          depends_on:
            - task_key: "bronze_customers_ingestion"
          notebook_task:
            notebook_path: "../../../pipelines/SILVER_Transformation_Pipeline.ipynb"
            base_parameters:
              config_dir: ""
              source_table: "customers"
              target_table: "customers_clean"
              environment: "${bundle.target}"
              stage: "${bundle.target}"
              client_id: "${var.client_id}"
              create_views: "false"

        # Task 3: Gold Mart Aggregations
        - task_key: "gold_customer_summary"
          depends_on:
            - task_key: "silver_customers_transformation"
          notebook_task:
            notebook_path: "../../../pipelines/GOLD_Aggregation_Pipeline.ipynb"
            base_parameters:
              config_dir: ""
              business_domain: "sales"
              target_table: "customer_summary"
              environment: "${bundle.target}"
              stage: "${bundle.target}"
              client_id: "${var.client_id}"
              create_views: "false"

        # Task 4: On-Demand / Scheduled Views Creation
        - task_key: "views_creation_task"
          depends_on:
            - task_key: "gold_customer_summary"
          notebook_task:
            notebook_path: "../../../pipelines/VIEWS_Creation_Pipeline.ipynb"
            base_parameters:
              config_dir: ""
              environment: "${bundle.target}"
              stage: "${bundle.target}"
              client_id: "${var.client_id}"
              layer: "all"

        # Task 5: Governance Access Control Reconciliation
        - task_key: "governance_security_task"
          depends_on:
            - task_key: "views_creation_task"
          notebook_task:
            notebook_path: "../../../pipelines/GOVERNANCE_Security_Pipeline.ipynb"
            base_parameters:
              config_dir: ""
              environment: "${bundle.target}"
              stage: "${bundle.target}"
              client_id: "${var.client_id}"
              dry_run: "false"

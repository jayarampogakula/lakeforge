# LakeForge SCD Type 2 Configuration
# Example: Customer Dimension

source_table: "customer_staging"
target_table: "customer_dimension"

catalog: "silver"
schema: "dimensions"

# Business keys for matching records
key_columns:
  - "customer_id"

# Columns to track for changes
tracked_columns:
  - "customer_name"
  - "email"
  - "phone"
  - "address"
  - "city"
  - "state"
  - "zip_code"
  - "customer_segment"

# SCD column names
effective_date_col: "effective_start_date"
end_date_col: "effective_end_date"
current_flag_col: "is_current"
hash_col: "record_hash"

# Load options
create_if_not_exists: true

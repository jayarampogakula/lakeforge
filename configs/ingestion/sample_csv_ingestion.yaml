# LakeForge Ingestion Configuration
# Example: CSV Ingestion

source_name: "sales_data"
source_type: "csv"
source_path: "/mnt/raw/sales/sales_2024.csv"

target_table: "sales_raw"
target_catalog: "bronze"
target_schema: "sales"

# File format options
file_format: "csv"
header: true
delimiter: ","
encoding: "utf-8"

# Schema options
infer_schema: true
schema_path: null

# Load options
mode: "append"  # append, overwrite, merge
partition_by:
  - "order_date"

# Audit columns
add_audit_columns: true

# Metadata
tags:
  domain: "sales"
  owner: "data_team"
  criticality: "high"

description: "Daily sales transaction data from ERP system"

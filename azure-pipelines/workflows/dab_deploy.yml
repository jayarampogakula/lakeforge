# Manual DAB deploy (Azure DevOps version of .github/workflows/dab_deploy.yml)
# Run from: Pipelines > Run pipeline, choose your branch, enter client_id + stage.
# Branch policy: non-dev stages deploy from 'main' ONLY; 'dev' from any branch.
# Stages are defined centrally in configs/environments/env_settings.json.
#
# Prerequisites: variable group 'databricks-auth' (Pipelines > Library) containing
#   DATABRICKS_HOST  = https://dbc-49ef00ea-2dda.cloud.databricks.com
#   DATABRICKS_TOKEN = service principal token (mark as secret)
# Optional: for a prod approval gate, convert the job to a 'deployment:' job tied to
# an Azure DevOps Environment with an Approvals check (see the official
# Azure DevOps + DABs guide for the pattern).

trigger: none
pr: none

parameters:
  - name: client_id
    displayName: 'Client ID (bundle located at deployments/<client_id>)'
    type: string
    default: client_alpha
  - name: stage
    displayName: 'Target stage (any stage in configs/environments/env_settings.json)'
    type: string
    default: dev
  - name: run_setup
    displayName: 'Run environment_setup job after deploy (tick for the FIRST deployment of this bundle to a stage - provisions catalogs/schemas/volumes)'
    type: boolean
    default: false

variables:
  - group: databricks-auth

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -e
      curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      databricks --version
    displayName: 'Install Databricks CLI'

  - script: |
      if ! jq -e --arg s "${{ parameters.stage }}" 'has($s)' configs/environments/env_settings.json > /dev/null; then
        echo "##vso[task.logissue type=error]Stage '${{ parameters.stage }}' is not defined in the stage registry (configs/environments/env_settings.json). Available stages: $(jq -r 'keys | join(", ")' configs/environments/env_settings.json)"
        exit 1
      fi
    displayName: 'Validate stage against registry'

  # Multi-account support: host comes from the registry (workspace_host),
  # fallback to per-stage variable group entries, else the global ones.
  # Credentials: per-stage service principal via OAuth client ID + secret
  # (DATABRICKS_<STAGE>_CLIENT_ID/_CLIENT_SECRET, M2M - takes precedence),
  # or a per-stage PAT (DATABRICKS_<STAGE>_TOKEN), else the global ones.
  # Add these to the 'databricks-auth' variable group (Pipelines > Library).
  - script: |
      set -euo pipefail
      STAGE_UPPER=$(echo "${{ parameters.stage }}" | tr '[:lower:]' '[:upper:]')
      HOST_VAR="DATABRICKS_${STAGE_UPPER}_HOST"
      TOKEN_VAR="DATABRICKS_${STAGE_UPPER}_TOKEN"
      CLIENT_ID_VAR="DATABRICKS_${STAGE_UPPER}_CLIENT_ID"
      CLIENT_SECRET_VAR="DATABRICKS_${STAGE_UPPER}_CLIENT_SECRET"
      STAGE_HOST=$(jq -r --arg s "${{ parameters.stage }}" '.[$s].workspace_host // empty' configs/environments/env_settings.json)
      if [ -z "$STAGE_HOST" ] && [ -n "${!HOST_VAR:-}" ]; then
        STAGE_HOST="${!HOST_VAR}"
      fi
      if [ -n "$STAGE_HOST" ]; then
        echo "##vso[task.setvariable variable=DATABRICKS_HOST]$STAGE_HOST"
        echo "Using stage-specific host: $STAGE_HOST"
      else
        echo "Using global DATABRICKS_HOST (stage in this workspace/account)."
      fi
      if [ -n "${!CLIENT_ID_VAR:-}" ] && [ -n "${!CLIENT_SECRET_VAR:-}" ]; then
        # Service principal OAuth (M2M): client ID + secret win over any token.
        echo "##vso[task.setvariable variable=DATABRICKS_CLIENT_ID]${!CLIENT_ID_VAR}"
        echo "##vso[task.setvariable variable=DATABRICKS_CLIENT_SECRET;issecret=true]${!CLIENT_SECRET_VAR}"
        echo "##vso[task.setvariable variable=DATABRICKS_TOKEN]"
        echo "Using service-principal OAuth client credentials (M2M) for stage '${{ parameters.stage }}'."
      elif [ -n "${!TOKEN_VAR:-}" ]; then
        echo "##vso[task.setvariable variable=DATABRICKS_TOKEN]${!TOKEN_VAR}"
        echo "Using stage-specific token for stage '${{ parameters.stage }}'."
      else
        echo "Using global DATABRICKS_TOKEN for stage '${{ parameters.stage }}'."
      fi
    displayName: 'Select stage credentials'

  - script: |
      if [ "${{ parameters.stage }}" != "dev" ] && [ "$(Build.SourceBranchName)" != "main" ]; then
        echo "##vso[task.logissue type=error]Stage '${{ parameters.stage }}' may only be deployed from branch 'main' (current: '$(Build.SourceBranchName)'). Feature branches can deploy to dev only."
        exit 1
      fi
    displayName: 'Enforce branch policy (non-dev stages deploy from main only)'

  - script: |
      set -e
      if [ ! -f databricks.yml ]; then
        echo "##vso[task.logissue type=error]No bundle found at deployments/${{ parameters.client_id }} - run the DAB export pipeline first."
        exit 1
      fi
      databricks bundle validate --target ${{ parameters.stage }}
    displayName: 'Validate bundle'
    workingDirectory: $(Build.SourcesDirectory)/deployments/${{ parameters.client_id }}
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
      DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

  - script: |
      set -e
      databricks bundle deploy --target ${{ parameters.stage }}
    displayName: 'Deploy bundle'
    workingDirectory: $(Build.SourcesDirectory)/deployments/${{ parameters.client_id }}
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
      DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

  # First-deployment step: provisions the stage's catalogs/schemas/volumes
  # (idempotent). Requires the environment_setup job resource in the bundle.
  - script: |
      set -e
      databricks bundle run environment_setup --target ${{ parameters.stage }}
    condition: eq('${{ parameters.run_setup }}', 'True')
    displayName: 'Run environment setup job (first deployment to this stage)'
    workingDirectory: $(Build.SourcesDirectory)/deployments/${{ parameters.client_id }}
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
      DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

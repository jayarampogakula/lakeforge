# LakeForge Azure DevOps CI/CD Multi-Stage Pipeline
# Fully compatible with LakeForge CLI, Databricks Asset Bundles (DABs), and Terraform.
# Zero framework code changes required - 100% engine & runner agnostic.

trigger:
  branches:
    # Branch policy: dev/feature/bugfix branches deploy to DEV only (guarded in DeployStage);
    # test/staging/prod deployments are only ever built from main.
    include:
      - main
      - release/*
      - dev
      - feature/*
      - bugfix/*

pr:
  branches:
    include:
      - main

parameters:
  - name: stage
    displayName: "Deployment Stage / Environment (any stage in configs/environments/env_settings.json)"
    type: string
    default: dev

  - name: client_id
    displayName: "Tenant / Client ID (Optional Scoping)"
    type: string
    default: "none"

  - name: component
    displayName: "Component to Deploy"
    type: string
    default: all
    values:
      - all
      - configs
      - notebooks
      - dabs
      - terraform

  - name: dry_run
    displayName: "Dry Run (Validation & Planning Only)"
    type: boolean
    default: false

variables:
  - name: PYTHON_VERSION
    value: "3.10"
  # Set Databricks secrets in Azure DevOps Pipeline Library Variable Groups
  # - group: LakeForge-Databricks-Credentials

stages:
  - stage: BuildAndTest
    displayName: "1. Build & Unit Test Verification"
    jobs:
      - job: TestJob
        displayName: "Run Unit Tests & Config Validation"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python $(PYTHON_VERSION)"
            inputs:
              versionSpec: $(PYTHON_VERSION)
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -e ".[dev]"
            displayName: "Install LakeForge Package & Dependencies"

          - script: |
              python -m pytest tests/unit_tests/ -v
            displayName: "Execute PyTest Unit Tests"

          - script: |
              lakeforge validate configs --env dev
            displayName: "Validate Metadata Configurations"

  - stage: IntegrationTest
    displayName: "2. End-to-End Integration Tests"
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: IntegrationJob
        displayName: "Execute Integration Test Suite"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python $(PYTHON_VERSION)"
            inputs:
              versionSpec: $(PYTHON_VERSION)
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -e ".[dev]"
            displayName: "Install Package"

          - script: |
              python -m pytest tests/integration_tests/ -v
            displayName: "Execute Integration Test Suite"

  - stage: DeployStage
    displayName: "3. Deploy to Stage: ${{ parameters.stage }}"
    dependsOn: [BuildAndTest, IntegrationTest]
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: "Execute LakeForge Deployment"
        pool:
          vmImage: "ubuntu-latest"
        environment: ${{ parameters.stage }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UsePythonVersion@0
                  displayName: "Use Python $(PYTHON_VERSION)"
                  inputs:
                    versionSpec: $(PYTHON_VERSION)
                    addToPath: true

                - script: |
                    python -m pip install --upgrade pip
                    pip install -e .
                  displayName: "Install LakeForge CLI"

                - script: |
                    if ! jq -e --arg s "${{ parameters.stage }}" 'has($s)' configs/environments/env_settings.json > /dev/null; then
                      echo "##vso[task.logissue type=error]Stage '${{ parameters.stage }}' is not defined in the stage registry (configs/environments/env_settings.json). Available stages: $(jq -r 'keys | join(", ")' configs/environments/env_settings.json)"
                      exit 1
                    fi
                  displayName: "Validate Stage Against Registry"

                # Multi-account support: host comes from the registry (workspace_host),
                # fallback to per-stage variable group entries, else the global ones.
                # Credentials: per-stage service principal via OAuth client ID + secret
                # (DATABRICKS_<STAGE>_CLIENT_ID/_CLIENT_SECRET, M2M - takes precedence),
                # or a per-stage PAT (DATABRICKS_<STAGE>_TOKEN), else the global ones.
                - script: |
                    set -euo pipefail
                    STAGE_UPPER=$(echo "${{ parameters.stage }}" | tr '[:lower:]' '[:upper:]')
                    HOST_VAR="DATABRICKS_${STAGE_UPPER}_HOST"
                    TOKEN_VAR="DATABRICKS_${STAGE_UPPER}_TOKEN"
                    CLIENT_ID_VAR="DATABRICKS_${STAGE_UPPER}_CLIENT_ID"
                    CLIENT_SECRET_VAR="DATABRICKS_${STAGE_UPPER}_CLIENT_SECRET"
                    STAGE_HOST=$(jq -r --arg s "${{ parameters.stage }}" '.[$s].workspace_host // empty' configs/environments/env_settings.json)
                    if [ -z "$STAGE_HOST" ] && [ -n "${!HOST_VAR:-}" ]; then
                      STAGE_HOST="${!HOST_VAR}"
                    fi
                    if [ -n "$STAGE_HOST" ]; then
                      echo "##vso[task.setvariable variable=DATABRICKS_HOST]$STAGE_HOST"
                      echo "Using stage-specific host: $STAGE_HOST"
                    else
                      echo "Using global DATABRICKS_HOST (stage in this workspace/account)."
                    fi
                    if [ -n "${!CLIENT_ID_VAR:-}" ] && [ -n "${!CLIENT_SECRET_VAR:-}" ]; then
                      # Service principal OAuth (M2M): client ID + secret win over any token.
                      echo "##vso[task.setvariable variable=DATABRICKS_CLIENT_ID]${!CLIENT_ID_VAR}"
                      echo "##vso[task.setvariable variable=DATABRICKS_CLIENT_SECRET;issecret=true]${!CLIENT_SECRET_VAR}"
                      echo "##vso[task.setvariable variable=DATABRICKS_TOKEN]"
                      echo "Using service-principal OAuth client credentials (M2M) for stage '${{ parameters.stage }}'."
                    elif [ -n "${!TOKEN_VAR:-}" ]; then
                      echo "##vso[task.setvariable variable=DATABRICKS_TOKEN]${!TOKEN_VAR}"
                      echo "Using stage-specific token for stage '${{ parameters.stage }}'."
                    else
                      echo "Using global DATABRICKS_TOKEN for stage '${{ parameters.stage }}'."
                    fi
                  displayName: "Select Stage Credentials"

                - script: |
                    BRANCH_NAME="$(Build.SourceBranchName)"
                    TARGET_STAGE="${{ parameters.stage }}"
                    if [ "$TARGET_STAGE" != "dev" ] && [ "$BRANCH_NAME" != "main" ]; then
                      echo "##vso[task.logissue type=error]Stage '$TARGET_STAGE' may only be deployed from 'main' (current branch: '$BRANCH_NAME'). Feature/dev-branch runs deploy to dev only."
                      exit 1
                    fi
                  displayName: "Enforce Branch Policy (non-dev stages deploy from main only)"

                - script: |
                    CLIENT_ARG=""
                    if [ "${{ parameters.client_id }}" != "none" ] && [ -n "${{ parameters.client_id }}" ]; then
                      CLIENT_ARG="--client ${{ parameters.client_id }}"
                    fi

                    DRY_RUN_ARG=""
                    if [ "${{ parameters.dry_run }}" = "True" ] || [ "${{ parameters.dry_run }}" = "true" ]; then
                      DRY_RUN_ARG="--dry-run"
                    fi

                    echo "Deploying LakeForge to Stage: ${{ parameters.stage }}"
                    echo "Component: ${{ parameters.component }}"
                    python -m lakeforge.cli.deploy \
                      --stage ${{ parameters.stage }} \
                      --component ${{ parameters.component }} \
                      $CLIENT_ARG \
                      $DRY_RUN_ARG
                  displayName: "Run LakeForge Stage Deployment"
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
